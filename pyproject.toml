[project]
name = "vertex-ai-ml-pipeline"
version = "0.1.0"
description = "Gated training pipeline for Vertex AI Pipelines: validate, train, evaluate, register only if quality passes."
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4", "pandas>=2.0", "joblib>=1.3"]

[project.optional-dependencies]
pipeline = ["kfp>=2.7", "google-cloud-aiplatform>=1.60"]
gcs = ["gcsfs"]

[tool.setuptools]
packages = ["mlpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
